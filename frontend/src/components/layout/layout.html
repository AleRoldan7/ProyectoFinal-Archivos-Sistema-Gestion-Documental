<div class="flex min-h-screen flex-col bg-slate-50 md:flex-row">
  <aside class="border-b border-slate-200 bg-white md:w-60 md:shrink-0 md:border-b-0 md:border-r">
    <div class="flex items-center justify-between px-4 py-3 md:block">
      <h1 class="text-lg font-bold text-blue-700">📂 Gestor de archivos</h1>
      <button type="button" class="rounded-lg border border-slate-300 px-3 py-1 text-sm text-slate-600 hover:bg-slate-100 md:hidden" (click)="salir()">Salir</button>
    </div>

    <nav class="flex gap-1 overflow-x-auto px-2 pb-2 md:flex-col md:overflow-visible md:pb-0">
      @for (op of opcionesVisibles; track op.ruta) {
        <a
          [routerLink]="op.ruta"
          routerLinkActive="bg-blue-50 text-blue-700 font-semibold"
          class="flex shrink-0 items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-700 hover:bg-slate-100"
        >
          <span>{{ op.icono }}</span>
          <span>{{ op.etiqueta }}</span>
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="hidden items-center justify-end gap-4 border-b border-slate-200 bg-white px-6 py-3 md:flex">
      @if (usuario; as u) {
        <div class="text-right text-sm leading-tight">
          <p class="font-medium text-slate-800">{{ u.firstName }} {{ u.lastName }}</p>
          <p class="text-xs text-slate-500">{{ u.email }} · {{ u.rol === 'ADMIN' ? 'Administrador' : 'Usuario' }}</p>
        </div>
      }
      <button type="button" class="rounded-lg border border-slate-300 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100" (click)="salir()">Cerrar sesión</button>
    </header>

    <main class="flex-1 p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
